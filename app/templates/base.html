<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ComparAI — Compare preços de eletrodomésticos{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Compare preços de geladeiras em várias lojas online e físicas numa única tela — encontre a melhor oferta sem perder tempo.{% endblock %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">

  <!-- Alpine.js: interatividade leve (menu mobile, dropdowns, transições) -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- HTMX: busca dinâmica sem recarregar página (autocomplete desde o Passo 4) -->
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <!-- Lucide Icons: <i data-lucide="nome"></i>, renderizado em SVG por lucide.createIcons() -->
  <script src="https://unpkg.com/lucide@latest"></script>

  {% block extra_head %}{% endblock %}

  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-base text-ink font-body min-h-screen flex flex-col antialiased">
  {% include "components/navbar.html" %}

  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  {% include "components/footer.html" %}

  {% block extra_scripts %}{% endblock %}

  <script>
    lucide.createIcons();
    // Reconstrói os ícones depois de qualquer troca de conteúdo via HTMX
    // (ex: autocomplete) — sem isso, <i data-lucide="..."> injetado depois
    // do carregamento inicial ficaria sem virar SVG.
    document.body.addEventListener("htmx:afterSwap", () => lucide.createIcons());
  </script>
</body>
</html>
